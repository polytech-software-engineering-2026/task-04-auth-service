name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.9.7"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy app

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - run: uv sync --frozen

      - name: pytest tests/unit (ваши юнит-тесты)
        run: |
          set +e
          uv run pytest tests/unit -v
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "Юнит-тестов пока нет — это нормально, если задание ещё не начато."
            exit 0
          fi
          exit "$code"

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Обязательны только register и login — тянутся из шаблона по тегу,
      # правка своей копии не даёт эффекта. Остальной контракт (refresh,
      # user/update, user/history, logout, user/me) проверяют tests/integration/,
      # которые пишете вы, — они тоже гоняются здесь, против того же сервиса.
      - name: checkout reference contract tests
        uses: actions/checkout@v7
        with:
          repository: polytech-software-engineering-2026/task-04-auth-service
          ref: reference-v1
          path: .reference-template

      - name: sync reference contract tests
        run: |
          rm -rf contract_tests
          mv .reference-template/contract_tests contract_tests
          rm -rf .reference-template

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - run: uv sync --frozen

      - name: prepare .env
        run: test -f .env || cp .env.example .env

      - name: check docker-compose.yml exists
        run: |
          if [ ! -f docker-compose.yml ]; then
            echo "docker-compose.yml ещё не создан — задание не начато (см. README, раздел про Docker Compose)." >&2
            exit 1
          fi

      - name: docker compose up
        run: docker compose up -d --build

      - name: wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8002/health >/dev/null; then
              echo "Сервис ответил на /health"
              exit 0
            fi
            sleep 2
          done
          echo "Сервис не поднялся за отведённое время" >&2
          docker compose logs
          exit 1

      - name: run mandatory contract tests (register, login)
        env:
          AUTH_SERVICE_URL: http://localhost:8002
        run: uv run pytest contract_tests -v

      - name: run your integration tests (остальной контракт)
        env:
          AUTH_SERVICE_URL: http://localhost:8002
        run: |
          set +e
          uv run pytest tests/integration -v
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "Своих интеграционных тестов пока нет — это нормально, если задание ещё не начато."
            exit 0
          fi
          exit "$code"

      - name: docker compose logs
        if: always()
        run: test -f docker-compose.yml && docker compose logs || true

      - name: docker compose down
        if: always()
        run: test -f docker-compose.yml && docker compose down -v || true
